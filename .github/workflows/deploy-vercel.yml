name: Deploy to Vercel

# Deploys the Speed Link Express TanStack Start SSR application to Vercel
# WITHOUT the Vercel GitHub App integration.
#
# How it works:
#   1. Build here in CI, producing Vercel Build Output API v3 in .vercel/output
#      (Nitro emits this when NITRO_PRESET=vercel).
#   2. Upload that prebuilt output with `vercel deploy --prebuilt --prod`.
#
# Why build here rather than on Vercel: the VITE_* values are inlined into the
# client bundle at build time, so they must be present during the build step.
# Sourcing them from GitHub Secrets keeps them out of the repository.
#
# Every credential is read from GitHub Actions Secrets. No values are stored here.

on:
  push:
    branches: [main]
  # Allows a deployment to be triggered manually from the GitHub web UI or
  # mobile browser, without needing a new commit.
  workflow_dispatch:

# Never run two production deployments at once; cancel a superseded run.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        env:
          # Tells Nitro to emit Vercel Build Output API v3 (.vercel/output).
          # On Vercel's own builders this is auto-detected; in GitHub Actions
          # it must be set explicitly.
          NITRO_PRESET: vercel
          # Inlined into the client bundle at build time.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Read at runtime by SSR and server functions.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify Vercel build output
        run: |
          if [ ! -d .vercel/output/functions/__server.func ]; then
            echo "::error::Expected .vercel/output/functions/__server.func was not produced."
            echo "The SSR function is missing - the Nitro preset may not have applied."
            ls -R .vercel/output 2>/dev/null || echo "No .vercel/output directory at all."
            exit 1
          fi
          echo "Build Output API v3 verified:"
          ls .vercel/output
          ls .vercel/output/functions

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The runtime environment variables are pushed to the Vercel project so the
      # SSR function can read them. `vercel env add` fails if the key already
      # exists, so each is removed first; both sides are tolerant of a missing key
      # on the very first run.
      # Pin deployments to the project that owns speed-link-motion.vercel.app.
      # Without this the CLI infers a target each run and deploys land on
      # throwaway URLs while the alias keeps serving an old build.
      # VERCEL_PROJECT_ID/ORG_ID secrets remain optional and take precedence.
      - name: Link to the correct Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -u
          echo "::warning::PROJECTS >> $(vercel project ls --token "$VERCEL_TOKEN" 2>&1 | tr '\n' ' ' | cut -c1-400)"
          if [ -n "${ORG_ID:-}" ] && [ -n "${PROJECT_ID:-}" ]; then
            echo "Using VERCEL_ORG_ID/VERCEL_PROJECT_ID secrets."
          else
            vercel link --yes --project speed-link-motion --token "$VERCEL_TOKEN" \
              && echo "::warning::LINKED >> speed-link-motion" \
              || echo "::warning::LINK FAILED >> could not link to project speed-link-motion"
          fi

      - name: Deploy prebuilt output to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Optional. If unset, the first run creates the Vercel project
          # automatically; copy its IDs into these secrets afterwards so later
          # runs always target the same project.
          ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${ORG_ID:-}" ] && [ -n "${PROJECT_ID:-}" ]; then
            echo "Deploying to the linked Vercel project."
            export VERCEL_ORG_ID="$ORG_ID"
            export VERCEL_PROJECT_ID="$PROJECT_ID"
          else
            echo "::warning::VERCEL_ORG_ID/VERCEL_PROJECT_ID not set - Vercel will create or infer the project on this run. Add both secrets afterwards."
          fi
          url=$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::warning::FIRST DEPLOY URL >> $url"

      # Runtime vars must be synced AFTER the project exists and is linked -
      # `vercel env add` has no target project before the first deploy, which is
      # why the earlier pre-deploy attempt failed and left the SSR function
      # without Supabase config at runtime.
      - name: Sync runtime environment variables to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -u
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true

          sync_var() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then
              echo "::warning::$name secret is empty; skipping."
              return
            fi
            for env in production preview development; do
              vercel env rm "$name" "$env" --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
              printf '%s' "$value" | vercel env add "$name" "$env" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            done
            if vercel env ls production --token "$VERCEL_TOKEN" 2>/dev/null | grep -q "$name"; then
              echo "synced $name"
            else
              echo "::warning::Could not sync $name; set it manually in Vercel project settings."
            fi
          }
          sync_var SUPABASE_URL "$SUPABASE_URL"
          sync_var SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"

      # Redeploy so the SSR function picks up the variables just synced.
      # Vercel applies env changes to NEW deployments only.
      - name: Redeploy with runtime variables applied
        id: redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::warning::PRODUCTION URL >> $url"

      # Belt and braces: point the production alias at the deployment we just
      # made, in case the project's automatic alias did not follow.
      - name: Point production alias at this deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.redeploy.outputs.url }}
        run: |
          set -u
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "::warning::ALIAS >> no deployment url available"; exit 0
          fi
          vercel alias set "$DEPLOY_URL" speed-link-motion.vercel.app --token "$VERCEL_TOKEN" \
            && echo "::warning::ALIAS OK >> speed-link-motion.vercel.app -> $DEPLOY_URL" \
            || echo "::warning::ALIAS FAILED >> could not alias $DEPLOY_URL"
          echo "::warning::INSPECT >> $(vercel inspect speed-link-motion.vercel.app --token "$VERCEL_TOKEN" 2>&1 | tr '\n' ' ' | cut -c1-400)"

      # Production verification from inside CI, which can reach the live site.
      # Results are emitted as ::warning:: so they are readable via the
      # annotations API without access to the job log storage host.
      # Custom-domain diagnosis + attachment. Runs in CI because it has public
      # DNS and network access. Everything is reported via ::warning:: so it is
      # readable through the annotations API.
      - name: Write diagnostic helper
        run: |
          cat > /tmp/pd.py <<'PYEOF'
          import json, sys
          mode = sys.argv[1]
          if mode == "dom":
              d = json.load(open("/tmp/dom.json")).get("domain", {}) or {}
              print("intended=", d.get("intendedNameservers"),
                    "actual=", d.get("nameservers"),
                    "verified=", d.get("verified"),
                    "serviceType=", d.get("serviceType"))
          else:
              d = json.load(open("/tmp/pdom.json"))
              if d.get("error"):
                  print("error=", d["error"])
              for x in d.get("domains", []):
                  print(x.get("name"), "verified=", x.get("verified"),
                        "redirect=", x.get("redirect"))
          PYEOF
          sed -i 's/^          //' /tmp/pd.py
          head -3 /tmp/pd.py

      - name: Restore vercel.app as canonical
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -u
          D=speedlinkexpresslogistics.com
          W(){ echo "::warning::$1 >> $(echo "$2" | tr '\n' ' ' | cut -c1-300)"; }
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams" -o /tmp/teams.json
          TEAM=$(python3 -c "import json;t=json.load(open('/tmp/teams.json')).get('teams',[]);print(t[0]['id'] if t else '')")
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          # The unresolvable apex must not sit in front of the working URL.
          W "CLEAR-REDIRECT" "$(curl -s -X PATCH -H "$AUTH" -H 'Content-Type: application/json' -d '{"redirect":null,"redirectStatusCode":null}' "https://api.vercel.com/v9/projects/speed-link-motion/domains/www.$D?teamId=$TEAM" | cut -c1-160)"
          W "PROJECT-DOMAINS" "$(curl -s -H "$AUTH" "https://api.vercel.com/v9/projects/speed-link-motion/domains?teamId=$TEAM" -o /tmp/pdom.json && python3 /tmp/pd.py proj 2>&1)"

      - name: Verify live production site
        run: |
          set -u
          BASE="https://speed-link-motion.vercel.app"
          sleep 15
          codes=""
          for p in / /blog /auth /auth/callback /auth/update-password /tracking /book /dashboard /dashboard/shipments /admin /admin/platform /claim-ownership /favicon.png; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$BASE$p" || echo ERR)
            codes="$codes $p=$c"
          done
          echo "::warning::ROUTES >>$codes"

          html=$(curl -s --max-time 30 "$BASE/" || true)
          l5e=$(printf '%s' "$html" | grep -c "__l5e" || true)
          wa=$(printf '%s' "$html" | grep -c "wa.me/13252837971" || true)
          mark=$(printf '%s' "$html" | grep -c "speedlink-mark-" || true)
          lov=$(printf '%s' "$html" | grep -c "lovable.app" || true)
          echo "::warning::CONTENT >> __l5e=$l5e (want 0) wa.me=$wa (want >=1) bundled-logo=$mark (want >=1) lovable.app=$lov (want 0)"

      - name: Summary
        run: |
          {
            echo "### Vercel production deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${{ steps.redeploy.outputs.url || steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
